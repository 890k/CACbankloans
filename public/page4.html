<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAC Bank - Demande de Prêt (Résumé)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #0f2c59;
            --bank-hover: #184485;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--bank-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .header-title .cac { color: #60a5fa; margin-right: 4px; }
        .header-title .bank { color: #ffffff; }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 44, 89, 0.08);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--bank-primary);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #334155;
            outline: none;
            width: 100%;
        }

        .summary-card {
            background-color: #f8fafc;
            border-left: 4px solid var(--bank-primary);
            padding: 18px 16px;
            border-radius: 10px;
            margin: 10px 0 24px;
            border: 1px solid #e2e8f0;
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: #64748b;
            font-size: 13.5px;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 700;
            font-size: 13.5px;
            color: #0f172a;
            text-align: right;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--bank-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #64748b;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span class="cac">CAC</span><span class="bank"> Bank</span>
    </div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 3 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Statut Professionnel</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Employé" selected>Employé(e)</option>
                <option value="Entrepreneur / Commerçant">Entrepreneur / Commerçant</option>
                <option value="Étudiant">Étudiant(e)</option>
                <option value="Sans emploi">Sans emploi</option>
                <option value="Retraité">Retraité(e)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">Revenu Mensuel Moyen (FDJ)</label>
            <input type="number" id="income" class="form-control" placeholder="Ex: 250000" required>
        </div>

        <div class="summary-card">
            <h3>Résumé de la Demande</h3>
            <div class="summary-row">
                <span class="summary-label">Montant du Prêt :</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Durée du Prêt :</span>
                <span class="summary-value" id="sumDuration">--</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Objet du Prêt :</span>
                <span class="summary-value" id="sumPurpose">--</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Demandeur :</span>
                <span class="summary-value" id="sumName">--</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Téléphone :</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">SOUMETTRE LA DEMANDE</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 CAC International Bank Djibouti
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    if (amount) {
        const numAmount = Number(amount.replace(/\D/g, ''));
        document.getElementById('sumAmount').innerText = numAmount ? `${numAmount.toLocaleString('fr-FR')} FDJ` : `${amount} FDJ`;
    }

    document.getElementById('sumDuration').innerText = term ? term + " Mois" : "--";
    document.getElementById('sumPurpose').innerText = purpose ? purpose : "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
    document.getElementById('sumPhone').innerText = phone ? `+253 ${phone}` : "--";
};

function submitForm(event) {
    event.preventDefault();
    const incomeVal = document.getElementById('income').value.trim();
    if (!incomeVal) { alert("Veuillez indiquer votre revenu mensuel moyen."); return; }

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "FDJ"
    };

    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    window.location.href = "/page5";
}

function goBack() { window.location.href = "/page3"; }
</script>
</body>
</html>
